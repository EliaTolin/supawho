# Included in every location: nginx drops inherited add_header directives as
# soon as a location declares one of its own, so they can't live at server level.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Report-only for now: it logs violations in the browser console without
# blocking anything. Starlight relies on inline scripts and styles, Pagefind on
# WebAssembly, and analytics on stats.auroradigital.it. Once the console stays
# clean on the live site, rename the header to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://stats.auroradigital.it; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://stats.auroradigital.it; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
