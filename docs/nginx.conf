# The site moved from supawho.auroradigital.it to supawho.dev. Keep the old
# hostname routed to this container so existing links and search results land
# on the same path of the new domain.
server {
    listen 80;
    server_name supawho.auroradigital.it;
    server_tokens off;
    return 301 https://supawho.dev$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS ends at the proxy in front of this container, so nginx only ever sees
    # plain HTTP. Relative redirects keep "/commands" -> "/commands/" on the
    # visitor's scheme and host instead of bouncing through http://.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/markdown text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    # Astro emits directory-style URLs (/guides/security/index.html). HTML and
    # the other unhashed files are revalidated on every visit so a deploy shows
    # up immediately.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Plain-markdown copies of the docs for LLMs and AI agents (/llms.txt links
    # to them). Search engines should index the HTML page, not the copy.
    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Asset filenames are content-hashed, so they can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Only reachable as the error page, never as a 200 at /404.html.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;
}
