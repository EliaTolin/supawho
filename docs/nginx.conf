# The site moved from supawho.auroradigital.it to supawho.dev. Keep the old
# hostname routed to this container so existing links and search results land
# on the same path of the new domain.
server {
    listen 80;
    server_name supawho.auroradigital.it;
    return 301 https://supawho.dev$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Astro emits directory-style URLs (/guides/security/index.html).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Asset filenames are content-hashed, so they can be cached forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
